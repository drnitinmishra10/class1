<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fun Addition Worksheet</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Comic Sans MS', Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#ffecd2,#fcb69f);
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:950px;
    margin:auto;
    background:white;
    border-radius:30px;
    padding:25px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#ff7675;
    font-size:clamp(32px,5vw,48px);
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#555;
    font-size:20px;
    margin-bottom:25px;
}

.score{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    color:#0984e3;
    margin-bottom:25px;
}

.question-box{
    background:#fff8f0;
    border:3px dashed #fd79a8;
    border-radius:22px;
    padding:20px;
    margin-bottom:20px;
}

.question{
    text-align:center;
    font-size:clamp(28px,6vw,44px);
    font-weight:bold;
    color:#2d3436;
    margin-bottom:18px;
}

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
}

input{
    width:110px;
    padding:12px;
    border-radius:12px;
    border:2px solid #74b9ff;
    font-size:24px;
    text-align:center;
    outline:none;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:12px;
    background:#6c5ce7;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#5848c2;
}

.result{
    margin-top:15px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    display:none;
}

.correct{
    color:#00b894;
}

.wrong{
    color:#d63031;
}

.footer{
    text-align:center;
    margin-top:30px;
    font-size:18px;
    color:#555;
}

@media(max-width:600px){

    .container{
        padding:15px;
    }

    input{
        width:100%;
    }

    button{
        width:100%;
    }
}

</style>
</head>

<body>

<div class="container">

    <h1>🌈 Super Fun Addition 🌈</h1>

    <div class="subtitle">
        Solve the Addition Questions
    </div>

    <div class="score">
        Score: <span id="score">0</span> / 20
    </div>

    <div id="worksheet"></div>

    <div class="footer">
        ⭐ You Are Doing Amazing! ⭐
    </div>

</div>

<script>

const questions = [

    {a:2,b:2},
    {a:1,b:5},
    {a:4,b:2},
    {a:3,b:4},
    {a:5,b:1},

    {a:6,b:2},
    {a:2,b:7},
    {a:8,b:1},
    {a:3,b:6},
    {a:7,b:1},

    {a:4,b:5},
    {a:5,b:3},
    {a:1,b:8},
    {a:2,b:4},
    {a:6,b:1},

    {a:3,b:5},
    {a:7,b:2},
    {a:4,b:4},
    {a:8,b:0},
    {a:5,b:2}

];

let score = 0;

const worksheet = document.getElementById("worksheet");

questions.forEach((q,index)=>{

    const answer = q.a + q.b;

    const box = document.createElement("div");

    box.className = "question-box";

    box.innerHTML = `

        <div class="question">
            ${index+1}. ${q.a} + ${q.b} = ?
        </div>

        <div class="controls">

            <input type="number" id="input-${index}" min="0">

            <button onclick="checkAnswer(${index},${answer})">
                Check
            </button>

        </div>

        <div class="result" id="result-${index}"></div>

    `;

    worksheet.appendChild(box);

});

function checkAnswer(index,answer){

    const input = document.getElementById(`input-${index}`);

    const result = document.getElementById(`result-${index}`);

    const userAnswer = Number(input.value);

    if(result.dataset.done === "true"){
        return;
    }

    result.style.display = "block";

    if(userAnswer === answer){

        result.innerHTML = `✅ Right! Answer is ${answer}`;

        result.className = "result correct";

        score++;

        document.getElementById("score").innerText = score;

    }else{

        result.innerHTML = `❌ Wrong! Correct Answer is ${answer}`;

        result.className = "result wrong";

    }

    result.dataset.done = "true";

}

</script>

</body>
</html>
